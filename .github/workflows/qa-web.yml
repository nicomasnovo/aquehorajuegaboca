name: Verificar calidad web
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar pnpm
        run: corepack enable
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Probar sincronización de datos
        run: node --test tests/*.test.mjs
      - name: Verificar compilación de producción
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /aquehorajuegaboca
        run: pnpm exec next build
