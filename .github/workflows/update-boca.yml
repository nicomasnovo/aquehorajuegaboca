name: Actualizar datos de Boca
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boca-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar pnpm
        run: corepack enable
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Verificar el sincronizador
        run: node --test tests/sync-boca.test.mjs
      - name: 'Consultar ESPN: próximos partidos y resultados'
        id: sync
        continue-on-error: true
        run: node scripts/sync-boca.mjs
      - name: Guardar JSON y estado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/boca.json public/data/sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar datos de Boca y estado de sincronización'
            git push origin HEAD
          fi
      - name: Marcar fallo de API sin borrar la última carga válida
        if: steps.sync.outcome == 'failure'
        run: |
          echo 'ESPN no pudo actualizarse. Revisar public/data/sync-status.json.'
          exit 1
