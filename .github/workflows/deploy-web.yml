name: Build y publicar web
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'public/data/boca.json'
      - 'public/data/sync-status.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: boca-pages-deploy
  cancel-in-progress: false
jobs:
  sync:
    uses: ./.github/workflows/update-boca.yml
    permissions:
      contents: write
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar pnpm
        run: corepack enable
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Generar aplicación estática para GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /aquehorajuegaboca
        run: |
          pnpm exec next build
          touch out/.nojekyll
          test -f out/index.html
          test -f out/data/boca.json
          test -f out/data/sync-status.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: boca-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: boca-pages-${{ github.run_id }}-${{ github.run_attempt }}
